<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Barcodes</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>Barcodes</h1>
      <p class="subtitle">EAN-13 stickers, 3 × 8 per A4 sheet (70 × 36 mm)</p>
    </header>

    <main>
      <section class="controls">
        <label for="csv">Products CSV <span class="hint">(columns: ean, count, description)</span></label>
        <textarea id="csv" rows="16" spellcheck="false"></textarea>

        <div class="row">
          <label class="file">
            Load CSV file…
            <input id="csv-file" type="file" accept=".csv,text/csv" />
          </label>
          <label class="file">
            Logo (PNG/JPEG)…
            <input id="logo-file" type="file" accept="image/png,image/jpeg" />
          </label>
          <span id="logo-name" class="hint">no logo</span>
          <button id="logo-clear" type="button" hidden>Remove logo</button>
        </div>

        <div class="row">
          <label><input id="border" type="checkbox" /> Show sticker outlines</label>
        </div>

        <div class="row">
          <button id="generate" type="button" class="primary">Generate PDF</button>
          <a id="download" hidden>Download PDF</a>
          <a id="open" target="_blank" rel="noopener" hidden>Open in new tab</a>
        </div>

        <ul id="messages"></ul>
      </section>

      <section class="preview">
        <iframe id="preview" title="PDF preview"></iframe>
      </section>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
