<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Print EAN-13 barcode stickers for your products, on A4 sheets with 3 × 8 stickers." />
    <title>Barcodes</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="1" y="1" width="22" height="22" rx="5" fill="currentColor" />
          <path d="M6 6v12M8.5 6v12M10 6v12M13 6v12M15.5 6v12M18 6v12" stroke="var(--bg)" stroke-width="1.4" />
        </svg>
        <h1>Barcodes</h1>
      </div>
      <div class="header-actions">
        <button id="add-product" type="button" class="btn primary"></button>
      </div>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>

    <main class="layout">
      <section class="panel products" aria-labelledby="products-title">
        <div class="panel-head">
          <h2 id="products-title">Products</h2>
          <span id="product-total" class="muted"></span>
        </div>

        <div class="filters">
          <label class="search">
            <span class="visually-hidden">Search or scan an EAN</span>
            <input id="search" type="search" placeholder="Search or scan EAN" autocomplete="off" enterkeyhint="go" />
          </label>
          <label class="check">
            <input id="only-selected" type="checkbox" />
            Selected only
          </label>
        </div>
        <p id="list-status" class="status" role="status" aria-live="polite"></p>

        <ul id="product-list" class="product-list"></ul>
        <div id="list-empty" class="empty" hidden></div>

        <footer class="order-bar">
          <span id="order-summary" aria-live="polite"></span>
          <button id="clear-counts" type="button" class="btn subtle">Clear counts</button>
        </footer>
      </section>

      <section class="panel preview" aria-labelledby="preview-title">
        <div class="panel-head">
          <h2 id="preview-title">Stickers</h2>
          <div class="preview-options">
            <div id="start-picker"></div>
            <label class="check">
              <input id="show-border" type="checkbox" />
              Outlines
            </label>
          </div>
        </div>
        <div class="preview-frame">
          <iframe id="preview" title="PDF preview of the stickers" hidden></iframe>
          <div id="preview-empty" class="empty">
            <p><strong>No stickers yet</strong></p>
            <p class="muted">Set how many stickers you need for each product and they appear here.</p>
          </div>
        </div>
        <div class="preview-actions">
          <p class="hint">Print at 100&nbsp;% (“Actual size”), not “Fit to page”.</p>
          <div class="buttons">
            <a id="open-pdf" class="btn" target="_blank" rel="noopener" aria-disabled="true"></a>
            <a id="download-pdf" class="btn primary" aria-disabled="true"></a>
          </div>
        </div>
      </section>
    </main>

    <dialog id="product-dialog" class="dialog" aria-labelledby="product-dialog-title">
      <form id="product-form" method="dialog" novalidate>
        <h2 id="product-dialog-title">Add product</h2>
        <label class="field">
          <span>EAN</span>
          <input id="product-ean" name="ean" inputmode="numeric" autocomplete="off" maxlength="13"
            placeholder="13 digits" required />
          <small id="product-ean-hint" class="field-hint"></small>
        </label>
        <label class="field">
          <span>Description <small class="muted">(as printed, one item per line)</small></span>
          <textarea id="product-description" name="description" rows="5" required></textarea>
          <ul id="product-warnings" class="warnings"></ul>
        </label>
        <p id="product-error" class="error" role="alert"></p>
        <div class="dialog-actions">
          <button id="product-delete" type="button" class="btn danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" class="btn" data-close>Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
