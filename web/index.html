<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Print EAN-13 barcode stickers for your products, on A4 sheets with 3 × 8 stickers." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)" />
    <title>Barcodes</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <!-- Texts are translated by translatePage() in src/i18n.ts: data-i18n (text),
       data-i18n-html (markup) and data-i18n-attr ("attribute:key;..."). -->
  <body>
    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="1" y="1" width="22" height="22" rx="5" fill="currentColor" />
          <path d="M6 6v12M8.5 6v12M10 6v12M13 6v12M15.5 6v12M18 6v12" stroke="var(--bg)" stroke-width="1.4" />
        </svg>
        <h1 data-i18n="appName">Barcodes</h1>
      </div>
      <div class="header-actions">
        <button id="open-settings" type="button" class="btn subtle" data-i18n-attr="aria-label:settingsAndData"></button>
        <button id="add-product" type="button" class="btn primary"></button>
      </div>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>
    <div id="backup-banner" class="banner" hidden>
      <span data-i18n="backupBanner"></span>
      <button id="backup-banner-now" type="button" class="btn" data-i18n="backupNow"></button>
      <button id="backup-banner-later" type="button" class="btn subtle" data-i18n="later"></button>
    </div>

    <main class="layout">
      <section class="panel products" aria-labelledby="products-title">
        <div class="panel-head">
          <h2 id="products-title" data-i18n="products"></h2>
          <span id="product-total" class="muted"></span>
        </div>

        <div class="filters">
          <label class="search">
            <span class="visually-hidden" data-i18n="searchLabel"></span>
            <input id="search" type="search" autocomplete="off" enterkeyhint="go"
              data-i18n-attr="placeholder:searchPlaceholder" />
          </label>
          <label class="check">
            <input id="only-selected" type="checkbox" />
            <span data-i18n="selectedOnly"></span>
          </label>
        </div>
        <p id="list-status" class="status" role="status" aria-live="polite"></p>

        <ul id="product-list" class="product-list"></ul>
        <div id="list-empty" class="empty" hidden></div>

        <footer class="order-bar">
          <span id="order-summary" aria-live="polite"></span>
          <button id="clear-counts" type="button" class="btn subtle" data-i18n="clearCounts"></button>
        </footer>
      </section>

      <section class="panel preview" aria-labelledby="preview-title">
        <div class="panel-head">
          <h2 id="preview-title" data-i18n="stickers"></h2>
          <div class="preview-options">
            <div id="start-picker"></div>
            <label class="check">
              <input id="show-border" type="checkbox" />
              <span data-i18n="outlines"></span>
            </label>
          </div>
        </div>
        <div class="preview-frame">
          <iframe id="preview" data-i18n-attr="title:previewTitle" hidden></iframe>
          <div id="preview-empty" class="empty">
            <p><strong data-i18n="noStickersYet"></strong></p>
            <p class="muted" data-i18n="noStickersHint"></p>
          </div>
        </div>
        <div class="preview-actions">
          <p class="hint" data-i18n="printHint"></p>
          <div class="buttons">
            <a id="open-pdf" class="btn" target="_blank" rel="noopener" aria-disabled="true"></a>
            <a id="download-pdf" class="btn primary" aria-disabled="true"></a>
          </div>
        </div>
      </section>
    </main>

    <dialog id="product-dialog" class="dialog" aria-labelledby="product-dialog-title">
      <form id="product-form" method="dialog" novalidate>
        <h2 id="product-dialog-title"></h2>
        <label class="field">
          <span data-i18n="ean"></span>
          <input id="product-ean" name="ean" inputmode="numeric" autocomplete="off" maxlength="13"
            data-i18n-attr="placeholder:eanPlaceholder" required />
          <small id="product-ean-hint" class="field-hint"></small>
        </label>
        <label class="field">
          <span><span data-i18n="description"></span> <small class="muted" data-i18n="descriptionHint"></small></span>
          <textarea id="product-description" name="description" rows="5" required></textarea>
          <ul id="product-warnings" class="warnings"></ul>
        </label>
        <p id="product-error" class="error" role="alert"></p>
        <div class="dialog-actions">
          <button id="product-delete" type="button" class="btn danger" hidden data-i18n="delete"></button>
          <span class="spacer"></span>
          <button type="button" class="btn" data-close data-i18n="cancel"></button>
          <button type="submit" class="btn primary" data-i18n="save"></button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title">
      <div class="dialog-body">
        <div class="dialog-title-row">
          <h2 id="settings-title" data-i18n="settingsTitle"></h2>
          <button type="button" class="btn subtle" data-close data-i18n="close"></button>
        </div>

        <section class="settings-section">
          <h3><label for="language-select" data-i18n="language"></label></h3>
          <select id="language-select" class="select"></select>
        </section>

        <section class="settings-section">
          <h3 data-i18n="logo"></h3>
          <p class="muted" data-i18n="logoHint"></p>
          <div class="logo-row">
            <div id="logo-preview" class="logo-preview"></div>
            <div class="buttons">
              <label class="btn">
                <span data-i18n="chooseImage"></span>
                <input id="logo-file" type="file" accept="image/*" hidden />
              </label>
              <button id="logo-remove" type="button" class="btn subtle" data-i18n="remove"></button>
            </div>
          </div>
        </section>

        <section id="settings-products" class="settings-section">
          <h3 data-i18n="importExportTitle"></h3>
          <p class="muted" data-i18n-html="importExportHintHtml"></p>
          <div class="buttons">
            <label class="btn">
              <span data-i18n="importCsv"></span>
              <input id="csv-file" type="file" accept=".csv,.txt,text/csv,text/plain" hidden />
            </label>
            <button id="csv-export" type="button" class="btn" data-i18n="exportCsv"></button>
          </div>
          <div id="import-result" class="result" role="status"></div>
        </section>

        <section class="settings-section">
          <h3 data-i18n="backupTitle"></h3>
          <p class="muted" data-i18n="backupHint"></p>
          <div class="buttons">
            <button id="backup-export" type="button" class="btn primary" data-i18n="backupToFile"></button>
            <label class="btn">
              <span data-i18n="restoreFromBackup"></span>
              <input id="backup-file" type="file" accept=".json,application/json" hidden />
            </label>
          </div>
          <p id="backup-status" class="small muted"></p>
          <div id="restore-result" class="result" role="status"></div>
        </section>

        <section class="settings-section">
          <h3 data-i18n="installTitle"></h3>
          <p class="muted" data-i18n="installHint"></p>
          <ul class="muted small" data-i18n-html="installStepsHtml"></ul>
        </section>

        <p class="small muted">
          <span data-i18n="sourceCode"></span>
          <a href="https://github.com/bzamecnik/barcodes" target="_blank" rel="noopener">github.com/bzamecnik/barcodes</a>
        </p>
      </div>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
